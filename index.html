<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#236457">
  <title>猫と犬の画像分類</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">CAT OR DOG · CPU INFERENCE</p>
    <h1>この子は、猫？ 犬？</h1>
    <p>写真を選ぶと、学習したモデルが判定します。画像は送信されず、この端末の中で処理します。</p>
    <section class="card" aria-label="画像分類">
      <button id="load" type="button">モデルを読み込む</button>
      <p id="status" role="status" aria-live="polite">最初にモデルを読み込んでください。</p>
      <div class="inputs">
        <label>写真を選ぶ<input id="photo" type="file" accept="image/*" disabled></label>
        <label>カメラで撮る<input id="camera" type="file" accept="image/*" capture="environment" disabled></label>
      </div>
      <img id="preview" alt="選択した写真" hidden>
      <div id="result" aria-live="polite" hidden>
        <h2 id="prediction"></h2>
        <div id="scores"></div>
        <p id="timing" class="muted"></p>
      </div>
    </section>
    <p class="note">猫と犬の2種類を分類するモデルです。それ以外の写真も、どちらかとして判定されます。表示する確率は正解を保証するものではありません。</p>
    <p class="note">初回はモデルと実行ライブラリをダウンロードします。通信環境や端末によって時間がかかります。実行方式：WebAssembly / CPU</p>
  </main>
</body>
</html>
